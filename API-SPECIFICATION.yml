openapi: 3.0.3
info:
  title: Payment Processing System API
  description: |
    API for payment flows (Authorize.Net sandbox integration). Contains endpoints for Purchase, Authorize, Capture, Cancel (void), Refund, Recurring Billing (Subscriptions), and Webhook handling. 
    JWT bearer is used to protect payment endpoints. Webhooks use HMAC signature validation. 
    All mutating endpoints support Idempotency-Key header for safe retries. 
    All responses include X-Correlation-ID for distributed tracing.
  version: 2.0.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /auth/token:
    post:
      summary: Exchange developer_key for a short-lived JWT (development only)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - developer_key
              properties:
                developer_key:
                  type: string
                  example: dev-local-key
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        '401':
          description: Invalid developer key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/health:
    get:
      summary: Health check
      tags:
        - payments
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /payments/purchase:
    post:
      summary: Purchase (authorize + capture)
      tags:
        - payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Payment declined by gateway (card declined, insufficient funds, fraud hold)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDeclinedResponse'
        '502':
          description: Gateway error (Authorize.Net returned an error or is unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
        '504':
          description: Gateway timeout (Authorize.Net did not respond in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutResponse'
        '409':
          description: Idempotency conflict (different request body for same key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'

  /payments/authorize:
    post:
      summary: Authorize only (two-step)
      tags:
        - payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Authorization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Payment declined by gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDeclinedResponse'
        '502':
          description: Gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutResponse'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/capture:
    post:
      summary: Capture a previously authorized transaction
      tags:
        - payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '200':
          description: Capture result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict or invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Capture declined by gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDeclinedResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '502':
          description: Gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutResponse'

  /payments/cancel:
    post:
      summary: Void (cancel) a previously authorized transaction
      tags:
        - payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Void result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict or invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cancel declined by gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDeclinedResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '502':
          description: Gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutResponse'

  /payments/refund:
    post:
      summary: Refund (full or partial) a captured transaction
      tags:
        - payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Original transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict or invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Refund declined by gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDeclinedResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '502':
          description: Gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutResponse'

  /payments/subscriptions:
    post:
      summary: Create a recurring billing subscription
      tags:
        - subscriptions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Validation error
        '502':
          description: Gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentErrorResponse'

  /payments/subscriptions/{id}:
    get:
      summary: Get subscription by ID
      tags:
        - subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Subscription not found
    put:
      summary: Update a subscription
      tags:
        - subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: Subscription not found or update failed
    delete:
      summary: Cancel a subscription
      tags:
        - subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    example: cancelled
                  cancelled_at:
                    type: string
                    format: date-time
        '404':
          description: Subscription not found

  /webhooks/authorize-net:
    post:
      summary: Receive Authorize.Net webhook events
      description: |
        Validates HMAC signature, deduplicates by notificationId, persists event, 
        and queues for async processing. NOT protected by JWT — uses HMAC signature.
      tags:
        - webhooks
      security: []
      parameters:
        - name: X-ANET-Signature
          in: header
          required: false
          description: SHA-512 HMAC signature of the payload
          schema:
            type: string
            example: "sha512=ABCDEF..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationId:
                  type: string
                eventType:
                  type: string
                  example: net.authorize.payment.authcapture.created
      responses:
        '200':
          description: Webhook received or already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '401':
          description: Invalid webhook signature

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Card:
      type: object
      properties:
        number:
          type: string
          description: Card PAN
          example: "4111111111111111"
        expMonth:
          type: integer
          example: 12
        expYear:
          type: integer
          example: 2030
        cvv:
          type: string
          example: "123"
      required:
        - number
        - expMonth
        - expYear
        - cvv

    PurchaseRequest:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          example: 12.34
        currency:
          type: string
          example: USD
        card:
          $ref: '#/components/schemas/Card'
        orderId:
          type: string
          example: ext-100
      required:
        - amount
        - card

    PurchaseResponse:
      type: object
      properties:
        order_id:
          type: integer
          example: 100
        transaction_id:
          type: string
          example: prov-123
        status:
          type: string
          example: success

    CaptureRequest:
      type: object
      properties:
        transactionId:
          type: string
          example: prov-auth-123
        amount:
          type: number
          format: decimal
          example: 10.00
      required:
        - transactionId

    CaptureResponse:
      type: object
      properties:
        transaction_id:
          type: string
          example: prov-capture-123
        status:
          type: string
          example: success

    CancelRequest:
      type: object
      properties:
        transactionId:
          type: string
          example: prov-auth-123
      required:
        - transactionId

    RefundRequest:
      type: object
      properties:
        transactionId:
          type: string
          example: prov-captured-123
        amount:
          type: number
          format: decimal
          example: 5.00
        last4:
          type: string
          description: Last 4 digits of the card (required by Authorize.Net refunds)
          example: "1111"
      required:
        - transactionId
        - last4

    RefundResponse:
      type: object
      properties:
        refund_transaction_id:
          type: string
          example: prov-refund-123
        status:
          type: string
          example: success

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "transaction not found"

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            amount: "must be >= 0.01"
            card.number: "invalid card number"

    PaymentErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: GATEWAY_TIMEOUT
            message:
              type: string
              example: The payment gateway timed out
            category:
              type: string
              example: GATEWAY_ERROR
            retryable:
              type: boolean
              example: true
            retry_after_seconds:
              type: integer
              example: 5
            provider_error:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
            suggestions:
              type: array
              items:
                type: string
            request_id:
              type: string
              example: req_abc123
            timestamp:
              type: string
              format: date-time

    CreateSubscriptionRequest:
      type: object
      required:
        - name
        - amount
        - startDate
        - card
      properties:
        name:
          type: string
          example: Monthly Premium Plan
        amount:
          type: number
          format: decimal
          example: 29.99
        intervalLength:
          type: integer
          example: 1
          default: 1
        intervalUnit:
          type: string
          enum: [days, months]
          example: months
          default: months
        startDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-04-01"
        card:
          $ref: '#/components/schemas/Card'

    UpdateSubscriptionRequest:
      type: object
      properties:
        name:
          type: string
          example: Annual Premium Plan
        amount:
          type: number
          format: decimal
          example: 49.99

    SubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        gateway_subscription_id:
          type: string
          example: "12345"
        name:
          type: string
          example: Monthly Premium Plan
        amount:
          type: number
          example: 29.99
        interval:
          type: string
          example: "1 months"
        start_date:
          type: string
          example: "2026-04-01"
        status:
          type: string
          enum: [active, suspended, cancelled, expired, failed]
          example: active
        created_at:
          type: string
          format: date-time

    WebhookResponse:
      type: object
      properties:
        status:
          type: string
          enum: [received, already_processed]
        notification_id:
          type: string
        event_id:
          type: integer

    PaymentDeclinedResponse:
      type: object
      description: Returned when Authorize.Net declines the transaction (card declined, AVS mismatch, fraud hold)
      properties:
        error_code:
          type: string
          enum: [CARD_DECLINED, INSUFFICIENT_FUNDS, FRAUD_SUSPECTED, AVS_MISMATCH]
          example: CARD_DECLINED
        message:
          type: string
          example: "Transaction was declined by the issuing bank"
        category:
          type: string
          enum: [DECLINE]
          example: DECLINE
        retryable:
          type: boolean
          example: false
        request_id:
          type: string
          example: "req_abc12345"

    GatewayErrorResponse:
      type: object
      description: Returned when Authorize.Net returns an error or is unreachable
      properties:
        error_code:
          type: string
          enum: [GATEWAY_ERROR, GATEWAY_UNAVAILABLE, GATEWAY_COMMUNICATION_ERROR]
          example: GATEWAY_ERROR
        message:
          type: string
          example: "Payment gateway returned an error"
        category:
          type: string
          enum: [GATEWAY]
          example: GATEWAY
        retryable:
          type: boolean
          example: true
        retry_after_seconds:
          type: integer
          description: Suggested wait time before retry (exponential backoff)
          example: 5
        request_id:
          type: string
          example: "req_abc12345"

    GatewayTimeoutResponse:
      type: object
      description: Returned when Authorize.Net does not respond within timeout window
      properties:
        error_code:
          type: string
          enum: [GATEWAY_TIMEOUT]
          example: GATEWAY_TIMEOUT
        message:
          type: string
          example: "Payment gateway did not respond in time"
        category:
          type: string
          enum: [GATEWAY]
          example: GATEWAY
        retryable:
          type: boolean
          example: true
        retry_after_seconds:
          type: integer
          example: 10
        request_id:
          type: string
          example: "req_abc12345"

    RateLimitResponse:
      type: object
      description: Returned when API rate limit is exceeded (Resilience4j @RateLimiter)
      properties:
        error_code:
          type: string
          enum: [RATE_LIMIT_EXCEEDED]
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          example: "Too many requests. Please retry after a short delay."
        retryable:
          type: boolean
          example: true
        retry_after_seconds:
          type: integer
          description: Suggested wait time before retrying
          example: 1
        suggestion:
          type: string
          example: "Reduce request frequency or implement backoff"
        request_id:
          type: string
          example: "req_abc12345"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Idempotency key for safe retries (24h TTL). Same key + same body returns cached response.
      schema:
        type: string
        example: "purchase-order-123-v1"

    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Correlation ID for distributed tracing. Auto-generated if not provided.
      schema:
        type: string
        example: "abc12345-6789-def0"

tags:
  - name: payments
    description: Payment endpoints (purchase, authorize, capture, cancel, refund)
  - name: subscriptions
    description: Recurring Billing / Subscription Management
  - name: webhooks
    description: Async payment event handlers (Authorize.Net webhooks)
  - name: auth
    description: Authentication helpers (development only)

