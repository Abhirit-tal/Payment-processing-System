# Test Configuration - Using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# JPA/Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (H2 uses ddl-auto=create-drop)
spring.flyway.enabled=false

# Allow bean definition overriding for test configs (e.g., TestRabbitConfig overrides RabbitMQConfig)
spring.main.allow-bean-definition-overriding=true

# Disable RabbitMQ and Vault for tests (use mock/in-memory)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.cloud.vault.config.VaultAutoConfiguration,org.springframework.cloud.vault.config.VaultObservationAutoConfiguration,org.springframework.cloud.vault.config.VaultReactiveAutoConfiguration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Disable Spring Cloud Vault for tests
spring.cloud.vault.enabled=false

# Disable OpenTelemetry tracing for tests
management.tracing.enabled=false

# Application
general.app.name=Payment Processing System (Test)

# Authorize.Net (empty for tests - tests mock or skip gateway calls)
authnet.environment=sandbox
authnet.api.login.id=
authnet.transaction.key=

# JWT settings for tests
jwt.secret=test-secret-key-for-jwt-32bytes!!
jwt.expiration-seconds=3600

# Developer key for tests
developer.key=dev-local-key

# Webhook signature key for tests
authnet.webhook.signature-key=test-webhook-key

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Resilience4j - relax for tests
resilience4j.circuitbreaker.instances.authorizeNet.slidingWindowSize=5
resilience4j.circuitbreaker.instances.authorizeNet.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authorizeNet.waitDurationInOpenState=5s

# Logging
logging.level.com.example.payment=DEBUG

