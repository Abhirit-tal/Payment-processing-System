# ==================== Production Profile Configuration ====================
# Activate with: SPRING_PROFILES_ACTIVE=prod

# ==================== TLS/SSL Configuration ====================
# Uncomment and configure for direct HTTPS termination.
# For most deployments, TLS is terminated at the reverse proxy (nginx/ALB).
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:keystore.p12}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=${SSL_KEY_ALIAS:payment-service}
# server.ssl.protocol=TLS
# server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
# server.port=8443

# ==================== Database ====================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# ==================== Distributed Tracing ====================
# Sample 5% of traces in production (adjust based on volume)
management.tracing.sampling.probability=0.05

# ==================== Security ====================
# Disable Swagger UI in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ==================== Actuator ====================
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# ==================== Logging ====================
# JSON structured logging is activated via logback-spring.xml for prod profile
logging.level.com.example.payment=INFO
logging.level.root=WARN

# ==================== Graceful Shutdown ====================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# ==================== Connection Pool Tuning ====================
spring.datasource.hikari.leak-detection-threshold=30000

