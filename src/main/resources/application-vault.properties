# ==================== Vault Secrets Management Profile ====================
# Activate with: SPRING_PROFILES_ACTIVE=prod,vault
#
# Prerequisites:
#   1. HashiCorp Vault server running and unsealed
#   2. Secrets stored at: secret/payment-processing-system
#   3. AppRole or Token authentication configured
#
# Vault Secret Structure:
#   secret/payment-processing-system
#     ??? authnet.api.login.id
#     ??? authnet.transaction.key
#     ??? authnet.webhook.signature-key
#     ??? jwt.secret
#     ??? spring.datasource.password
#     ??? spring.rabbitmq.password

# ==================== Spring Cloud Vault Configuration ====================
spring.config.import=vault://
spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=payment-processing-system

# ==================== AppRole Authentication (Alternative) ====================
# spring.cloud.vault.authentication=APPROLE
# spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:}
# spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:}
# spring.cloud.vault.app-role.app-role-path=approle

# ==================== Vault Health Check ====================
management.health.vault.enabled=true

# ==================== API Key Rotation ====================
# Vault supports dynamic secrets and automatic rotation.
# Configure a max-lease-ttl for payment secrets:
#   vault write secret/data/payment-processing-system ttl=24h
# Application will re-fetch on next request after TTL expiry.
spring.cloud.vault.kv.application-name=payment-processing-system

