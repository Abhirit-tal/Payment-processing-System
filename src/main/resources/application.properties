# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Application
general.app.name=Payment Processing System

# Authorize.Net sandbox credentials (set via env or override here for local dev)
authnet.environment=${AUTHNET_ENVIRONMENT:sandbox}
authnet.api.login.id=${AUTHNET_API_LOGIN_ID:}
authnet.transaction.key=${AUTHNET_TRANSACTION_KEY:}

# JWT settings
jwt.secret=${JWT_SECRET:my-super-secret-key-for-dev-32bytes}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Developer key for /auth/token endpoint
developer.key=${DEVELOPER_KEY:dev-local-key}

# Logging
logging.level.com.example.payment=DEBUG

