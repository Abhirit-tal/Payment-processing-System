# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# ==================== HikariCP Connection Pool Tuning ====================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# IMPORTANT: validate only ? Flyway manages all schema migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==================== Flyway Database Migration ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Application
general.app.name=Payment Processing System

# Authorize.Net sandbox credentials (set via env or override here for local dev)
authnet.environment=${AUTHNET_ENVIRONMENT:sandbox}
authnet.api.login.id=${AUTHNET_API_LOGIN_ID:}
authnet.transaction.key=${AUTHNET_TRANSACTION_KEY:}
# Webhook signature key (configured in Authorize.Net merchant portal)
authnet.webhook.signature-key=${AUTHNET_WEBHOOK_SIGNATURE_KEY:}

# JWT settings ? NO hardcoded fallbacks for production safety
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Developer key for /auth/token endpoint
developer.key=${DEVELOPER_KEY:}

# Logging ? includes correlation ID and trace/span IDs for distributed tracing
logging.level.com.example.payment=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-N/A}] [traceId=%X{traceId:-N/A} spanId=%X{spanId:-N/A}] %-5level %logger{36} - %msg%n

# ==================== Actuator & Observability ====================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${general.app.name}
management.metrics.tags.environment=${authnet.environment}
# Show external dependency health (DB, RabbitMQ, circuit breakers)
management.health.circuitbreakers.enabled=true
management.health.rabbit.enabled=true

# ==================== Distributed Tracing (OpenTelemetry) ====================
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ==================== RabbitMQ Configuration ====================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
# Graceful degradation: don't crash if queues are missing or RabbitMQ is unavailable
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Connection recovery
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.requested-heartbeat=30

# ==================== Resilience4j Circuit Breaker ====================
resilience4j.circuitbreaker.instances.authorizeNet.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authorizeNet.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authorizeNet.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authorizeNet.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.authorizeNet.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.authorizeNet.slidingWindowType=COUNT_BASED

# ==================== Resilience4j Rate Limiter ====================
# Limit payment API calls to 100 requests per second per instance
resilience4j.ratelimiter.instances.paymentApi.limitForPeriod=100
resilience4j.ratelimiter.instances.paymentApi.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.paymentApi.timeoutDuration=0s
resilience4j.ratelimiter.instances.paymentApi.registerHealthIndicator=true

# Webhook endpoint rate limiter (higher limit for async events)
resilience4j.ratelimiter.instances.webhookApi.limitForPeriod=200
resilience4j.ratelimiter.instances.webhookApi.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.webhookApi.timeoutDuration=0s

# ==================== Request Size Limits ====================
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB

# ==================== Graceful Shutdown ====================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

