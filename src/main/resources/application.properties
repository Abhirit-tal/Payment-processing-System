spring.datasource.url=jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
general.app.name=Payment Processing System

authnet.environment=${AUTHNET_ENVIRONMENT:sandbox}
authnet.transaction.key=${AUTHNET_TRANSACTION_KEY:}
authnet.api.login.id=${AUTHNET_API_LOGIN_ID:}
# Authorize.Net sandbox credentials (set via env or override here for local dev)

developer.key=${DEVELOPER_KEY:dev-local-key}

jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.secret=${JWT_SECRET:change-me-please}
# JWT settings

# Enable debug logging for security package to capture JwtFilter logs
logging.level.com.example.payment=DEBUG

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.password=
spring.datasource.username=sa
spring.datasource.driverClassName=org.h2.Driver
